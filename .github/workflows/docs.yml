name: Deploy Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: knowledgebase-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOY_HOST: 123.57.48.214
      RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt -r deploy/aliyun/requirements-smoke.txt

      - name: Test deployment validation and rollback
        run: python -m unittest discover -s deploy/aliyun/tests -v

      - name: Install smoke-test browser
        run: python -m playwright install --with-deps chromium

      - name: Generate topic-quiz data
        run: python scripts/generate_topic_quiz_data.py

      - name: Verify knowledge metadata
        run: python scripts/verify_knowledge_metadata.py

      - name: Generate legacy path redirects
        run: python scripts/generate_redirect_maps.py

      - name: Build site
        run: mkdocs build --strict

      - name: Package release
        id: package
        run: |
          checksum=$(python deploy/aliyun/package.py --release "$RELEASE")
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Configure restricted deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.ALIYUN_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ALIYUN_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/knowledgebase
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/knowledgebase ~/.ssh/known_hosts

      - name: Deploy to Aliyun
        id: aliyun
        env:
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          ssh -i ~/.ssh/knowledgebase -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            kbdeploy@"$DEPLOY_HOST" "deploy $RELEASE $CHECKSUM" < release.tar.gz

      - name: Check public home, article and search
        id: smoke
        run: python deploy/aliyun/smoke.py --release "$RELEASE"

      - name: Roll back failed production checks
        if: ${{ failure() && steps.aliyun.outcome == 'success' && steps.smoke.outcome == 'failure' }}
        run: |
          ssh -i ~/.ssh/knowledgebase -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            kbdeploy@"$DEPLOY_HOST" "rollback $RELEASE"
          curl --fail --silent --show-error --retry 2 --max-time 30 \
            https://knowledgebase.wenyiapp.cn/release-manifest.json

      - name: Save production check evidence
        if: ${{ always() && steps.smoke.outcome != 'skipped' && steps.smoke.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: smoke-results/
          retention-days: 14

      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/knowledgebase

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
