server {
    listen 80;
    listen [::]:80;
    server_name knowledgebase.wenyiapp.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://knowledgebase.wenyiapp.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name knowledgebase.wenyiapp.cn;

    ssl_certificate /etc/letsencrypt/live/knowledgebase.wenyiapp.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/knowledgebase.wenyiapp.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KnowledgebaseTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/knowledgebase/current;
    index index.html;
    charset utf-8;
    autoindex off;
    error_page 404 /404.html;

    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    access_log /var/log/nginx/knowledgebase.access.log;
    error_log /var/log/nginx/knowledgebase.error.log;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
}
