evidence:
  basis:
    default: source_anchored
    labels:
      source_anchored: 正文给出可回查资料；资料质量仍需结合 volatility 复核。
      experience_pattern: 组织或案例题以可迁移的方法论为主，不能冒充本人经历。
  reproducibility:
    default: explanation_only
    precedence:
      - external_acceptance
      - integration_harness
      - deterministic_test
      - illustrative_artifact
      - explanation_only
    derive_illustrative_artifact_from_nonempty_code_refs: true
    deterministic_test:
      - S-CODE-01
      - S-CODE-02
      - S-CODE-03
      - S-CODE-04
      - S-CODE-05
      - S-CODE-06
      - S-CODE-07
      - S-BC-12
      - S-EXCH-01
      - S-EXCH-17
      - S-EXCH-18
      - S-EXCH-19
      - S-EXCH-20
      - S-EXCH-21
      - S-EXCH-22
      - S-WALLET-02
      - S-PAY-01
      - S-NODE-02
      - S-NODE-07
      - S-SEC-04
    integration_harness:
      - S-WALLET-07
      - S-WALLET-08
      - S-WALLET-09
      - S-WALLET-10
      - S-WALLET-11
      - S-NODE-09
      - S-SEC-02
    external_acceptance: []
    labels:
      explanation_only: 只有结构化解释、SQL 或配置片段，不代表运行验收。
      illustrative_artifact: 仓库存在关联代码或配置，未自动等价于测试通过。
      deterministic_test: 存在不依赖外部服务的确定性测试或回放门禁。
      integration_harness: 存在 localnet、testnet、HSM/MPC 或故障注入 harness；覆盖范围看正文。
      external_acceptance: 有真实厂商、生产环境或外部系统的具名验收记录。
  volatility:
    default: stable
    version_sensitive_prefixes:
      - S-AI-
      - S-BC-
      - S-SOLID-
      - S-WALLET-
      - S-NODE-
      - S-PROTO-
      - S-CLOUD-
    version_sensitive:
      - S-CONC-04
      - S-CONC-20
      - S-PG-01
      - S-PG-03
      - S-SEC-03
    vendor_or_regulatory_sensitive:
      - S-PAY-02
      - S-PAY-05
      - S-PAY-06
      - S-WALLET-07
      - S-WALLET-11
      - S-NODE-09
      - S-SEC-02
      - S-SEC-03
      - S-SEC-04
      - S-CLOUD-09
      - S-CLOUD-10
    labels:
      stable: 核心机制相对稳定，仍以目标版本行为为准。
      version_sensitive: 协议、运行时、SDK 或产品行为会随版本变化。
      vendor_or_regulatory_sensitive: 还受厂商能力、地区规则或法律意见影响。

