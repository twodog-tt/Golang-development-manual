site_name: Go · Agent · Web3 工程知识库
site_description: Go 生产工程、Web3 链上基建与资金链路、AI/Crypto Agent 控制面的开源工程知识库（235 篇）
site_url: https://twodog-tt.github.io/Golang-development-manual/
repo_url: https://github.com/twodog-tt/Golang-development-manual
repo_name: twodog-tt/Golang-development-manual

docs_dir: docs
site_dir: site
exclude_docs: |
  README.md

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 深色模式
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 浅色模式
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css
  - stylesheets/topic-quiz.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.min.js
  - javascript/mermaid-viewer.js
  - javascript/nav-accordion.js
  - javascript/legacy-path-redirect.js
  - javascript/topic-quiz.js

