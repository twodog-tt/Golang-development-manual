site_name: Go · Agent · Web3 架构师面试手册
site_description: 面向 5 年+ 资深 Go 后端、AI Agent Platform 与 Web3 架构岗位的 223 篇面试知识库
site_url: https://twodog-tt.github.io/Golang-development-manual/
repo_url: https://github.com/twodog-tt/Golang-development-manual
repo_name: twodog-tt/Golang-development-manual

docs_dir: docs
site_dir: site
exclude_docs: |
  README.md

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 深色模式
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 浅色模式
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css
  - stylesheets/mock-interview.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.min.js
  - javascript/mermaid-viewer.js
  - javascript/nav-accordion.js
  - javascript/mock-interview.js

plugins:
  - awesome-pages
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/twodog-tt/Golang-development-manual
