services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    command:
      - -host=0.0.0.0
      - -config=/config/toxiproxy.json
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:18899:18899"
      - "127.0.0.1:16657:16657"
      - "127.0.0.1:18080:18080"
      - "127.0.0.1:19125:19125"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    healthcheck:
      test:
        - CMD
        - /toxiproxy-cli
        - -host=127.0.0.1
        - -port=8474
        - list
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"

